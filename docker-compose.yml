name: blackbox-icecast

services:
  icecast:
    build: ./icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set in .env}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?set in .env}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:-${ICECAST_SOURCE_PASSWORD}}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_MAX_CLIENTS: ${ICECAST_MAX_CLIENTS:-400}
      ICECAST_MAX_SOURCES: ${ICECAST_MAX_SOURCES:-120}
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8000/status-json.xsl"]
      interval: 10s
      timeout: 5s
      retries: 5

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    restart: unless-stopped
    command: ["liquidsoap", "/etc/liquidsoap/main.liq"]
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?set in .env}
      PLAYERS: ${PLAYERS:-100}
      PLAYER_IDS: ${PLAYER_IDS:-}
      BEDS_DIR: /beds
    volumes:
      - ./liquidsoap/main.liq:/etc/liquidsoap/main.liq:ro
      - ${AUDIO_DIR:-./audio}:/audio:ro
      - ${BEDS_DIR:-./beds}:/beds:ro
    # telnet control stays container-internal; only the bridge reaches it

  bridge:
    build:
      context: .
      dockerfile: bridge/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:8090"
    depends_on:
      - liquidsoap
    environment:
      LIQUIDSOAP_HOST: liquidsoap
      LIQUIDSOAP_PORT: "1234"
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_ADMIN_USER: admin
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?set in .env}
      AUDIO_DIR: /audio
      BEDS_DIR: /beds
      LIQ_AUDIO_DIR: /audio
      LIQ_BEDS_DIR: /beds
      PLAYERS: ${PLAYERS:-100}
      PLAYER_IDS: ${PLAYER_IDS:-}
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:-}
      PUBLIC_STREAM_BASE: ${PUBLIC_STREAM_BASE:-}
      FLAG_AFTER_S: ${FLAG_AFTER_S:-20}
    volumes:
      - ${AUDIO_DIR:-./audio}:/audio:ro
      - ${BEDS_DIR:-./beds}:/beds:ro
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
