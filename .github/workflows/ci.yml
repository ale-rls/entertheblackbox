name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A new push supersedes the previous run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Deliberately no end-to-end job. This is an installation run by its own
# technical team, not software shipped to strangers, and the real check is a
# tech rehearsal in the venue with actual phones on the actual network. The
# Playwright specs are kept in tests/e2e and can be run by hand:
#
#   pnpm pocketbase:download   # once
#   pnpm test:e2e
#
# What CI protects is narrower and worth the minute: the code compiles, the
# clients build, and the scenario graph is valid. A build that breaks during
# a tech rehearsal is the failure mode this catches.
jobs:
  audio-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAYERS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Validate script with the production Liquidsoap image
        run: docker build -f services/audio/liquidsoap/Dockerfile services/audio
      - name: Start the production audio stack and verify music controls
        run: |
          docker compose --project-directory . --env-file deploy/coolify/.env.example -f deploy/coolify/docker-compose.yml -p audio-ci up --build --wait --wait-timeout 120 icecast liquidsoap bridge
          docker compose --project-directory . --env-file deploy/coolify/.env.example -f deploy/coolify/docker-compose.yml -p audio-ci exec -T bridge python < services/audio/scripts/smoke_music.py
      - name: Audio startup logs
        if: failure()
        run: docker compose --project-directory . --env-file deploy/coolify/.env.example -f deploy/coolify/docker-compose.yml -p audio-ci logs --no-color --tail 150 icecast liquidsoap bridge
      - name: Stop the test audio stack
        if: always()
        run: docker compose --project-directory . --env-file deploy/coolify/.env.example -f deploy/coolify/docker-compose.yml -p audio-ci down --volumes

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm
      - name: Validate Coolify Compose
        run: docker compose --env-file deploy/coolify/.env.example -f deploy/coolify/docker-compose.yml config --quiet
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm validate-scenario content/scenarios/dev.json
      - name: Build production client bundles
        run: pnpm --filter @entertheblackbox/display build && pnpm --filter @entertheblackbox/phone build && pnpm --filter @entertheblackbox/admin build && pnpm --filter @entertheblackbox/studio build
      - name: Build Coolify images
        run: docker compose --env-file deploy/coolify/.env.example -f deploy/coolify/docker-compose.yml build
