name: blackbox-janus

# Coolify Git deployment: repository-root build contexts; no host HTTP ports.
# Assign HTTPS domains to web:80 and bridge:8090. Keep Janus itself private.
services:
  janus:
    build:
      context: ./services/audio-janus
      target: janus
    restart: unless-stopped
    environment:
      JANUS_ADMIN_KEY: ${JANUS_ADMIN_KEY:?set a management secret in Coolify}
      JANUS_PUBLIC_IP: ${JANUS_PUBLIC_IP:?set the phone-reachable host IPv4 address in Coolify}
      JANUS_LISTENER_PIN: ${JANUS_LISTENER_PIN:?set a listener PIN in Coolify}
    ports:
      - "20000-20200:20000-20200/udp"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/janus/info', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build:
      context: ./services/audio-janus
      target: web
    restart: unless-stopped
    depends_on:
      janus:
        condition: service_healthy
    expose:
      - "80"
  tone:
    profiles: [test-tone]
    build:
      context: ./services/audio-janus
      target: tone
    restart: unless-stopped
    depends_on:
      janus:
        condition: service_healthy

  liquidsoap:
    build:
      context: ./services/audio-janus/personal
      dockerfile: liquidsoap.Dockerfile
    restart: unless-stopped
    environment:
      PLAYERS: ${JANUS_PLAYERS:-30}
    volumes:
      - janus-audio:/audio:ro
      - janus-beds:/beds
    depends_on:
      janus:
        condition: service_healthy
  bridge:
    build:
      context: ./services
      dockerfile: audio-janus/personal/Dockerfile
    restart: unless-stopped
    environment:
      PLAYERS: ${JANUS_PLAYERS:-30}
      BRIDGE_TOKEN: ${JANUS_BRIDGE_TOKEN:?set a bridge secret in Coolify}
      JANUS_ADMIN_KEY: ${JANUS_ADMIN_KEY:?set a management secret in Coolify}
    volumes:
      - janus-audio:/audio
      - janus-beds:/beds:ro
    expose:
      - "8090"
    depends_on:
      janus:
        condition: service_healthy
      liquidsoap:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  janus-audio:
  janus-beds:
