server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    location / { try_files $uri $uri/ =404; }
    location /janus {
        proxy_pass http://janus:8088;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
    }
}
