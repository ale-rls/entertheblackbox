[project]
name = "blackbox-icecast-bridge"
version = "0.1.0"
description = "Control bridge: REST -> Liquidsoap telnet + Icecast listener monitoring"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
