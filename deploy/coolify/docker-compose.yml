name: enter-the-blackbox

# Drop-in replacement for the existing enter-the-blackbox Coolify Compose
# resource. Service and volume names stay stable so domains and persistent
# PocketBase/audio data can be retained when the Git repository is changed.
services:
  frontend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:?set to the public PocketBase HTTPS URL}
        REALTIME_WS_URL: ${REALTIME_WS_URL:?set to the public WSS relay URL}
        DISPLAY_TOKEN: ${DISPLAY_TOKEN:?set in Coolify}
    # Keep published native audio and channel pointers across replacements.
    volumes:
      - native-shows:/app/content/media/native-shows
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      pocketbase:
        condition: service_healthy
      realtime:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "80"
      INSTALLATION_ID: ${INSTALLATION_ID:?set in Coolify}
      ROOM_ID: ${ROOM_ID:-main}
      SHOW_ID: ${SHOW_ID:-entertheblackbox}
      DISPLAY_TOKEN: ${DISPLAY_TOKEN:?set in Coolify}
      JOIN_GRANT_SECRET: ${JOIN_GRANT_SECRET:?set in Coolify}
      TRUST_PROXY: "true"
      ALLOW_LATE_JOIN: ${ALLOW_LATE_JOIN:-true}
      PHONE_JOIN_BASE_URL: ${PHONE_JOIN_BASE_URL:?set to the public frontend URL ending in /phone/}
      SHOW_PHONE_JOIN_BASE_URL: ${SHOW_PHONE_JOIN_BASE_URL:-true}
      MAX_PARTICIPANTS: ${MAX_PARTICIPANTS:-100}
      MAX_WEBSOCKET_CONNECTIONS: ${MAX_WEBSOCKET_CONNECTIONS:-300}
      JOIN_RATE_LIMIT_MAX_ATTEMPTS: ${JOIN_RATE_LIMIT_MAX_ATTEMPTS:-30}
      JOIN_RATE_LIMIT_WINDOW_MS: ${JOIN_RATE_LIMIT_WINDOW_MS:-60000}
      POCKETBASE_URL: http://pocketbase:8090
      POCKETBASE_ADMIN_EMAIL: ${POCKETBASE_ADMIN_EMAIL:?set in Coolify}
      POCKETBASE_ADMIN_PASSWORD: ${POCKETBASE_ADMIN_PASSWORD:?set in Coolify}
      # Native apps download verified releases; no headphone streaming services.
      TRACKINGBOX_URL: ${TRACKINGBOX_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  realtime:
    build:
      context: apps/realtime-ws-coolify
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "9001"
    environment:
      NODE_ENV: production
      WS_PORT: "9001"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  pocketbase:
    build:
      context: pocketbase
      dockerfile: Dockerfile
      args:
        PB_VERSION: ${PB_VERSION:-0.39.11}
        PB_ARCH: ${PB_ARCH:-amd64}
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - pocketbase-data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  native-shows:
  pocketbase-data:
  audio-data:
  # Historical stream volumes retained for data preservation; no stream services run.
  janus-audio:
  janus-beds:
